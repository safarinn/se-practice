<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Room Checker</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172b42;font:16px system-ui,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}h1{font-size:32px;line-height:1.15}section{background:white;border:1px solid #d6e0ec;border-radius:16px;padding:24px;margin:20px 0}.tag{font-size:12px;letter-spacing:2px;color:#33619b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600}input,select,button{font:inherit;width:100%;padding:12px;margin-top:7px;border:1px solid #a9bad0;border-radius:8px}input[type=checkbox]{width:auto;margin-right:8px}button{background:#215ac1;color:white;border:0;cursor:pointer}small{display:block;color:#52647b;margin-top:6px}.result{border-left:5px solid #215ac1;background:#f1f6ff;padding:18px;margin-top:20px}.result[data-ok=true]{border-color:#158353;background:#edf9f2}.result[data-ok=false]{border-color:#b84137;background:#fff2ef}h2{margin:0 0 8px;font-size:22px}p{line-height:1.5}#count{font-size:13px;color:#52647b}@media(max-width:480px){main{margin:0;padding:16px}.grid{grid-template-columns:1fr}section{padding:18px}h1{font-size:27px}}
</style></head><body><main><div class="tag">SMART CAMPUS · FICTIONAL DEMO</div><h1>Room availability checker</h1><p>Check a time interval. This page does not reserve a room.</p><section><h2>Room A101</h2><p id="bookings">Existing booking: 10:00–11:00</p><label><input id="blocked" type="checkbox">Room is blocked</label></section><section><form id="form" novalidate><div class="grid"><label>Supplied current time<input id="now" value="09:00" aria-label="Supplied current time" placeholder="HH:MM"></label><label>Start time<input id="start" value="11:00" aria-label="Start time" placeholder="HH:MM"></label><label>End time<input id="end" value="12:00" aria-label="End time" placeholder="HH:MM"><small>24:00 is allowed as the end of the day.</small></label></div><p>Maximum duration: 120 minutes. Touching booking endpoints is allowed.</p><button type="submit">Check availability</button></form><div id="result" class="result" role="status" aria-live="polite"><h2 id="decision">Ready to check</h2><div id="reason">Enter times in HH:MM format.</div></div><p id="count">Checks completed: 0</p></section></main><script>
const bookings=Object.freeze([Object.freeze({start:600,end:660})]);
function parseTime(value){const m=/^(\d{2}):(\d{2})$/.exec(value.trim());if(!m)return NaN;const h=Number(m[1]),n=Number(m[2]);return n<60&&(h<24||(h===24&&n===0))?h*60+n:NaN;}
function checkAvailability(start,end,now,blocked){
if(![start,end,now].every(Number.isFinite))return [false,'Enter valid times in HH:MM format (00:00–24:00).'];
if(now<0||now>=1440)return [false,'Supplied current time must be between 00:00 and 23:59.'];
if(start<0||end>1440||start>=end)return [false,'End time must be later than start time, within the same day.'];
if(start<=now)return [false,'Start time must be after the supplied current time.'];
if(end-start>120)return [false,'The interval exceeds the maximum of 120 minutes.'];
if(blocked)return [false,'Room A101 is blocked.'];
if(bookings.some(b=>start<b.end&&end>b.start))return [false,'The interval overlaps the existing booking 10:00–11:00.'];
return [true,'No conflicting booking. The room is available; no booking has been saved.'];}
let checks=0;document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const read=id=>parseTime(document.getElementById(id).value);const [ok,reason]=checkAvailability(read('start'),read('end'),read('now'),document.getElementById('blocked').checked);document.getElementById('decision').textContent=ok?'Available':'Unavailable';document.getElementById('reason').textContent=reason;document.getElementById('result').dataset.ok=ok;document.getElementById('count').textContent='Checks completed: '+(++checks);});
</script></body></html>
